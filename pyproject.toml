# Tool configuration only: dependency management lives in requirements*.txt.

[tool.black]
line-length = 88

[tool.isort]
profile = "google"
force_single_line = false
line_length = 88
# Keep isort's wrapping of long multi-name imports Black-compatible
# (parenthesized, one name per line, trailing comma) so the two agree.
multi_line_output = 3
include_trailing_comma = true

[tool.pytest.ini_options]
testpaths = ["tests"]
